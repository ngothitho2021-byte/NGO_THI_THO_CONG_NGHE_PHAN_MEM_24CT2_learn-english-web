<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Học Từ Đầu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Học Từ Đầu</a>
      <ul class="nav-links">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="pages/tu-vung.html">Từ vựng</a></li>
        <li><a href="pages/nghe.html">Nghe</a></li>
        <li><a href="pages/noi.html">Nói</a></li>
      </ul>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Đăng nhập</h1>
      <p class="auth-sub">Tiếp tục lộ trình học của bạn</p>

      <div class="auth-banner warn" id="authBanner"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="ban@email.com" required>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-submit">Đăng nhập</button>
      </form>

      <p class="auth-switch">
        Chưa có tài khoản? <a href="signup.html">Đăng ký ngay</a>
      </p>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    const banner  = document.getElementById('authBanner');
    const btnSubmit = document.querySelector('.auth-submit');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Hiện trạng thái đang tải
      btnSubmit.textContent = 'Đang đăng nhập…';
      btnSubmit.disabled = true;
      banner.classList.remove('show');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // loginUser giờ là async — phải dùng await
      const result = await loginUser(email, password);

      if (result.ok) {
        window.location.href = 'index.html';
        return;
      }

      // Hiện thông báo lỗi từ server
      banner.textContent = result.message || 'Email hoặc mật khẩu không đúng.';
      banner.classList.add('show');

      // Khôi phục nút
      btnSubmit.textContent = 'Đăng nhập';
      btnSubmit.disabled = false;
    });
  </script>

</body>
</html>
