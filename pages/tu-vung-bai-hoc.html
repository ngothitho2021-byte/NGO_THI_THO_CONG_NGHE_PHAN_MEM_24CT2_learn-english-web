<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ vựng — Food — Học Từ Đầu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  /* ==== CSS riêng cho bài học Từ vựng — có thể copy phần này vào style.css ==== */
  .lesson-wrap{max-width:720px;margin:0 auto;padding:32px 16px 64px;}
  .podcast-progress, .quiz-progress{font-weight:600;color:#2563eb;margin-bottom:12px;}
  .podcast-card{display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid #e5e7eb;
    border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .podcast-image, .quiz-image{display:flex;justify-content:center;align-items:center;
    height:180px;background:#f1f5f9;border-radius:12px;overflow:hidden;}
  .podcast-image img, .quiz-image img{max-height:100%;object-fit:contain;}
  .image-placeholder{font-size:48px;}
  .image-placeholder.big{font-size:64px;}
  .podcast-word-row{display:flex;align-items:center;gap:10px;}
  .podcast-word-row h3{font-size:28px;margin:0;}
  .btn-audio{border:none;background:#eff6ff;color:#2563eb;font-size:18px;width:36px;height:36px;
    border-radius:50%;cursor:pointer;}
  .btn-audio:hover{background:#dbeafe;}
  .ipa{color:#64748b;margin:2px 0 8px;}
  .meaning{font-weight:600;margin-bottom:8px;}
  .examples .example{margin:4px 0;color:#334155;}
  .example-vi{color:#94a3b8;}
  .podcast-controls{display:flex;gap:10px;margin-top:20px;}
  .podcast-controls .btn{flex:1;}
  .btn.danger{background:#fee2e2;color:#b91c1c;}
  .btn.danger:hover{background:#fecaca;}
  .btn.known-btn{background:#dcfce7;color:#15803d;}
  .btn.known-btn:hover{background:#bbf7d0;}
  .btn.ghost{background:transparent;border:1px solid #e5e7eb;}
  .podcast-summary{text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:16px;
    padding:32px;}
  .podcast-summary .success{color:#15803d;font-weight:600;}
  .hint-mode-switch{display:flex;gap:8px;margin-bottom:16px;}
  .hint-mode-switch .btn.small{flex:1;background:#f1f5f9;color:#334155;}
  .hint-mode-switch .btn.small.active{background:#2563eb;color:#fff;}
  .quiz-example-hint{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;
    padding:16px;text-align:center;margin-bottom:12px;}
  .quiz-box, .quiz-example-hint{margin-top:4px;}
  .quiz-box .input{width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;
    font-size:16px;margin-bottom:10px;}
  .quiz-box .input.correct{border-color:#22c55e;background:#f0fdf4;}
  .feedback.correct{color:#15803d;font-weight:600;}
  .feedback.wrong{color:#b91c1c;font-weight:600;}
  .quiz-buttons{display:flex;gap:10px;margin-top:8px;}
  .quiz-examples{margin-top:16px;border-top:1px solid #e5e7eb;padding-top:12px;}
  .lesson-section{display:none;}
  .lesson-section.visible{display:block;}
</style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="logo">Học Từ Đầu</a>
      <ul class="nav-links">
        <li><a href="../index.html">🏠 Trang chủ</a></li>
        <li><a href="tu-vung.html" class="active">📇 Từ vựng</a></li>
        <li><a href="nghe.html">🎧 Nghe</a></li>
        <li><a href="noi.html">🗣️ Nói</a></li>
        <li><a href="viet.html">✍️ Viết</a></li>
      </ul>
    </div>
  </header>

  <div class="lesson-wrap">
    <h2 class="page-title">📚 Từ vựng — Chủ đề: Food</h2>

    <!-- Bước 1: Học kiểu podcast -->
    <section id="podcastSection" class="lesson-section visible">
      <div id="podcastRoot"></div>
    </section>

    <!-- Bước 2: Ôn tập các từ chưa biết -->
    <section id="reviewSection" class="lesson-section">
      <h2 style="margin-top:32px;">🔁 Ôn tập</h2>
      <div id="reviewRoot"></div>
    </section>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/tu-vung-bai-hoc.js"></script>

</body>
</html>
